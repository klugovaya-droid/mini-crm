<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Мини-CRM</title>
    <script>
      // GitHub Pages serves this file for client-side routes. Redirect back to
      // the app shell while keeping the requested path for React Router.
      (function () {
        var pathSegmentsToKeep = 1;
        var location = window.location;
        location.replace(
          location.protocol +
            "//" +
            location.hostname +
            (location.port ? ":" + location.port : "") +
            location.pathname
              .split("/")
              .slice(0, 1 + pathSegmentsToKeep)
              .join("/") +
            "/?/" +
            location.pathname
              .slice(1)
              .split("/")
              .slice(pathSegmentsToKeep)
              .join("/")
              .replace(/&/g, "~and~") +
            (location.search
              ? "&" + location.search.slice(1).replace(/&/g, "~and~")
              : "") +
            location.hash,
        );
      })();
    </script>
  </head>
  <body></body>
</html>
